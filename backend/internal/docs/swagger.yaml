          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The session has no access to this child
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: A child's supplements or activities
      tags:
      - supplements
    post:
      consumes:
      - application/json
      description: |-
        Saves the routine the parent wrote, exactly as written, and generates its first doses. Part of the paid
        plan (the server decides): a free account gets 422 "freemium_consultation_limit_exceeded" with reason
        "supplements"; a child with 10 active routines gets 422 "routine_limit_exceeded".
      parameters:
