basePath: /
definitions:
  AccountNotFoundResponse:
    properties:
      error:
        example: account_not_found
        type: string
      message:
        example: Account not found
        type: string
    type: object
  ActiveTreatmentResponse:
    properties:
      endsAt:
        example: "2026-01-18T22:00:00Z"
        type: string
      medicationName:
        example: Amoxicilina
        type: string
      otherCount:
        example: 0
        type: integer
    type: object
  ChildNotFoundResponse:
    properties:
      error:
        example: child_not_found
        type: string
      message:
        example: Child not found
        type: string
    type: object
  ChildOverviewResponse:
    properties:
      activeTreatment:
        $ref: '#/definitions/ActiveTreatmentResponse'
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      doses:
        items:
          $ref: '#/definitions/OverviewDoseResponse'
        type: array
    type: object
  ConsultationDetailResponse:
    properties:
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      consultDate:
        example: "2026-01-15"
        type: string
      doctorName:
        example: Dra. López
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      medications:
        items:
          $ref: '#/definitions/MedicationResponse'
        type: array
      photoBase64:
        type: string
      symptoms:
        example: Tos y fiebre leve
        type: string
    type: object
  ConsultationFieldError:
    properties:
      field:
        example: doctorName
        type: string
      message:
        example: doctor name is required
        type: string
    type: object
  ConsultationListResponse:
    properties:
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      consultations:
        items:
          $ref: '#/definitions/ConsultationSummaryResponse'
        type: array
    type: object
  ConsultationNotFoundResponse:
    properties:
      error:
        example: consultation_not_found
        type: string
      message:
        example: Consultation not found
        type: string
    type: object
  ConsultationSummaryResponse:
    properties:
      consultDate:
        example: "2026-01-15"
        type: string
      doctorName:
        example: Dra. López
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      medicationCount:
        example: 2
        type: integer
      symptoms:
        example: Tos y fiebre leve
        type: string
    type: object
  ConsultationValidationErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/ConsultationFieldError'
        type: array
      error:
        example: validation_error
        type: string
      message:
        example: One or more fields are invalid
        type: string
    type: object
  DoseNotFoundResponse:
    properties:
      error:
        example: dose_not_found
        type: string
      message:
        example: Dose not found
        type: string
    type: object
  DoseResponse:
    properties:
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      scheduledAt:
        example: "2026-01-15T08:00:00Z"
        type: string
      taken:
        example: false
        type: boolean
    type: object
  EmailConflictResponse:
    properties:
      error:
        example: email_already_exists
        type: string
      message:
        example: Email is already in use
        type: string
    type: object
  ErrorResponse:
    properties:
      error:
        example: internal_error
        type: string
      message:
        example: Could not create account
        type: string
    type: object
  FieldError:
    properties:
      field:
        example: email
        type: string
      message:
        example: invalid email format
        type: string
    type: object
  FreemiumLimitResponse:
    properties:
      error:
        example: freemium_child_limit_exceeded
        type: string
      limit:
        example: 1
        type: integer
      message:
        example: The free plan includes only one child per account
        type: string
      received:
        example: 2
        type: integer
    type: object
  MedicationResponse:
    properties:
      doses:
        items:
          $ref: '#/definitions/DoseResponse'
        type: array
      durationDays:
        example: 5
        type: integer
      frequencyHours:
        example: 8
        type: integer
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      name:
        example: Amoxicilina
        type: string
      startTime:
        example: "08:00"
        type: string
    type: object
  NotFoundResponse:
    properties:
      error:
        example: country_not_found
        type: string
      message:
        example: Country not found in catalog
        type: string
    type: object
  OverviewDoseResponse:
    properties:
      consultationId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      medicationName:
        example: Amoxicilina
        type: string
      scheduledAt:
        example: "2026-01-15T14:00:00Z"
        type: string
      taken:
        example: false
        type: boolean
    type: object
  ValidationErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/FieldError'
        type: array
      error:
        example: validation_error
        type: string
      message:
        example: One or more fields are invalid
        type: string
    type: object
  internal_account.accountResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/internal_account.childResponse'
        type: array
      countryCode:
        example: MX
        type: string
      email:
        example: ana@example.com
        type: string
      firstName:
        example: Ana
        type: string
      id:
        example: e5f6a7b8-0000-0000-0000-000000000000
        type: string
      lastName:
        example: Gómez
        type: string
      plan:
        example: free
        type: string
      stateCode:
        example: MX-JAL
        type: string
    type: object
  internal_account.childResponse:
    properties:
      birthDate:
        example: "2020-01-15"
        type: string
      firstName:
        example: Luis
        type: string
      height:
        example: 95.5
        type: number
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      lastName:
        example: Gómez
        type: string
      weight:
        example: 14.2
        type: number
    type: object
  internal_account.createAccountRequest:
    properties:
      children:
        items:
          $ref: '#/definitions/internal_account.createChildRequest'
        type: array
      countryCode:
        example: MX
        type: string
      email:
        example: ana@example.com
        type: string
      firstName:
        example: Ana
        type: string
      lastName:
        example: Gómez
        type: string
      stateCode:
        example: MX-JAL
        type: string
    type: object
  internal_account.createChildRequest:
    properties:
      birthDate:
        example: "2020-01-15"
        type: string
      firstName:
        example: Luis
        type: string
      height:
        example: 95.5
        type: number
      lastName:
        example: Gómez
        type: string
      weight:
        example: 14.2
        type: number
    type: object
  internal_catalog.countryResponse:
    properties:
      code:
        example: MX
        type: string
      name:
        example: México
        type: string
    type: object
  internal_catalog.stateResponse:
    properties:
      code:
        example: MX-JAL
        type: string
      name:
        example: Jalisco
        type: string
    type: object
  internal_consultation.createConsultationRequest:
    properties:
      consultDate:
        example: "2026-01-15"
        type: string
      doctorName:
        example: Dra. López
        type: string
      medications:
        items:
          $ref: '#/definitions/internal_consultation.createMedicationRequest'
        type: array
      photoBase64:
        type: string
      symptoms:
        example: Tos y fiebre leve
        type: string
      utcOffsetMinutes:
        description: |-
          UTCOffsetMinutes is the parent's UTC offset, so "startTime" is read in
          their own time zone. Optional: 0 (default) means UTC.
        example: -360
        type: integer
    type: object
  internal_consultation.createMedicationRequest:
    properties:
      durationDays:
        example: 5
        type: integer
      frequencyHours:
        example: 8
        type: integer
      name:
        example: Amoxicilina
        type: string
      startTime:
        example: "08:00"
        type: string
    type: object
  internal_consultation.updateDoseRequest:
    properties:
      taken:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    Backend API for account/children signup and the país/estado catalog.
    See contracts/post-accounts.md and contracts/get-catalog.md under
    specs/001-registro-cuenta-usuario/ for the source-of-truth prose contracts.
  title: PediTrack API
  version: "1.0"
paths:
  /accounts:
    post:
      consumes:
      - application/json
      description: |-
        Creates a padre/tutor account, optionally with one or more children in the
        same request. A brand-new account always starts on the free plan, which
        allows at most 1 child (FR-007) — enforced server-side regardless of what
        the client already validated. No login/password is accepted here (FR-009).
      parameters:
      - description: Account (and optional children) to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.createAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "400":
          description: Missing/invalid field, e.g. a malformed email or future birth
            date
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/EmailConflictResponse'
        "422":
          description: Free plan already has 1 child; upgrade required
          schema:
            $ref: '#/definitions/FreemiumLimitResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create an account (tutor + optional children)
      tags:
      - accounts
  /accounts/{accountId}:
    get:
      description: |-
        Retrieves an account (tutor + children) by id, to populate the home page's
        children listing (FR-001). No authentication — the account id acts as a
        de facto access token, a deliberate continuation of the posture already
        accepted in specs/001/002 (see plan.md's privacy note).
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/AccountNotFoundResponse'
      summary: Get an account and its children
      tags:
      - accounts
  /accounts/{accountId}/children:
    post:
      consumes:
      - application/json
      description: |-
        Adds a single child to an account already created, from the home page's
        "Agregar hijo" modal (FR-004). Applies the same field validation and
        freemium 1-child limit as POST /accounts.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Child to add
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.createChildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "400":
          description: Missing/invalid field
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/AccountNotFoundResponse'
        "422":
          description: Free plan already has 1 child; upgrade required
          schema:
            $ref: '#/definitions/FreemiumLimitResponse'
      summary: Add a child to an existing account
      tags:
      - accounts
  /catalog/countries:
    get:
      description: Read-only catalog used to populate the país selector (contracts/get-catalog.md).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_catalog.countryResponse'
            type: array
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/NotFoundResponse'
      summary: List countries
      tags:
      - catalog
  /catalog/countries/{countryCode}/states:
    get:
      description: |-
        Used to populate the estado selector. Returns an empty array if the country
        has no subdivisions in the catalog (contracts/get-catalog.md).
      parameters:
      - description: ISO country code
        example: MX
        in: path
        name: countryCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_catalog.stateResponse'
            type: array
        "404":
          description: countryCode not found in catalog
          schema:
            $ref: '#/definitions/NotFoundResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/NotFoundResponse'
      summary: List states/provinces for a country
      tags:
      - catalog
  /children/{childId}/consultations:
    get:
      description: Lists a child's medical consultations (date, doctor, symptoms and
        medication count), most recent first (FR-001).
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConsultationListResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildNotFoundResponse'
      summary: List a child's consultations
      tags:
      - consultations
    post:
      consumes:
      - application/json
      description: |-
        Registers a consultation with its prescription photo, medications and symptoms
        (FR-003, FR-004). At least one medication is required (FR-015). Doses for any
        medication with a startTime are generated all at once (research.md).
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: Consultation to register
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_consultation.createConsultationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ConsultationDetailResponse'
        "400":
          description: Missing/invalid field
          schema:
            $ref: '#/definitions/ConsultationValidationErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildNotFoundResponse'
      summary: Register a new medical consultation
      tags:
      - consultations
  /children/{childId}/overview:
    get:
      description: |-
        Returns the doses scheduled in [from, to) (the parent's local "today"; the client
        sends the window because only it knows its timezone) and the treatment still
        running — the medication whose last scheduled dose is furthest ahead, derived only
        from the dose schedule. The window may not exceed 48 hours.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: Window start, RFC 3339
        example: "2026-01-15T00:00:00-06:00"
        in: query
        name: from
        required: true
        type: string
      - description: Window end (exclusive), RFC 3339
        example: "2026-01-16T00:00:00-06:00"
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ChildOverviewResponse'
        "400":
          description: Missing/invalid window
          schema:
            $ref: '#/definitions/ConsultationValidationErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildNotFoundResponse'
      summary: A child's doses in a window and active treatment
      tags:
      - consultations
  /consultations/{consultationId}:
    get:
      description: |-
        Retrieves the prescription photo, doctor, date, medications (with their doses,
        if any), and symptoms of a consultation (FR-013).
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConsultationDetailResponse'
        "404":
          description: No consultation exists for this id
          schema:
            $ref: '#/definitions/ConsultationNotFoundResponse'
      summary: Get a consultation's full detail
      tags:
      - consultations
  /consultations/{consultationId}/doses/{doseId}:
    patch:
      consumes:
      - application/json
      description: |-
        Sets a dose's taken status. No validation of scheduled date or treatment
        status — a dose can be marked/unmarked at any time (FR-011, FR-016).
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      - description: Dose UUID
        in: path
        name: doseId
        required: true
        type: string
      - description: New taken status
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_consultation.updateDoseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DoseResponse'
        "404":
          description: No dose exists for this id
          schema:
            $ref: '#/definitions/DoseNotFoundResponse'
      summary: Mark or unmark a dose as taken
      tags:
      - consultations
swagger: "2.0"
