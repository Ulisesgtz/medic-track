definitions:
  AccountNotFoundForSessionResponse:
    properties:
      error:
        example: account_not_found_for_session
        type: string
      message:
        example: No PediTrack account is linked to this session yet
        type: string
    type: object
  AccountNotFoundResponse:
    properties:
      error:
        example: account_not_found
        type: string
      message:
        example: Account not found
        type: string
    type: object
  ActiveTreatmentResponse:
    properties:
      endsAt:
        example: "2026-01-18T22:00:00Z"
        type: string
      medicationName:
        example: Amoxicilina
        type: string
      otherCount:
        example: 0
        type: integer
    type: object
  AppointmentErrorResponse:
    properties:
      error:
        example: forbidden
        type: string
      message:
        type: string
    type: object
  AppointmentMyRemindersRequest:
    properties:
      enabled:
        example: true
        type: boolean
    type: object
  AppointmentMyRemindersResponse:
    properties:
      myReminders:
        example: true
        type: boolean
    type: object
  AppointmentNoticeResponse:
    properties:
      atTime:
        example: "20:00"
        type: string
      daysBefore:
        example: 1
        type: integer
      fireAt:
        example: "2026-10-09T14:30:00Z"
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      kind:
        enum:
        - before
        - at_time
        example: before
        type: string
      label:
        example: 2 horas antes
        type: string
      leadMinutes:
        example: 120
        type: integer
      past:
        description: 'Past: it was due before the appointment was saved or has already
          gone off; it never fires.'
        example: false
        type: boolean
    type: object
  AppointmentOfConsultationResponse:
    properties:
      appointment:
        $ref: '#/definitions/AppointmentResponse'
      paidPlan:
        example: true
        type: boolean
    type: object
  AppointmentPlanLimitResponse:
    properties:
      error:
        example: freemium_consultation_limit_exceeded
        type: string
      message:
        type: string
      reason:
        description: Reason is "appointments" (creating and editing appointments are
          the paid plan's).
        example: appointments
        type: string
    type: object
  AppointmentRequest:
    properties:
      doctor:
        description: 'Doctor: the appointment''s own; on one of a consultation, empty
          means the consultation''s doctor.'
        example: Dra. Laura López
        type: string
      location:
        example: Consultorio 302, Av. Vallarta 1234
        type: string
      locationUrl:
        example: https://maps.app.goo.gl/abc
        type: string
      note:
        example: ""
        type: string
      notices:
        items:
          $ref: '#/definitions/internal_appointment.NoticeInput'
        type: array
      startsAt:
        example: "2026-10-09T10:30:00-06:00"
        type: string
      utcOffsetMinutes:
        example: -360
        type: integer
    type: object
  AppointmentResponse:
    properties:
      canEdit:
        description: 'CanEdit: the session can do everything AND the owner''s plan
          is paid.'
        example: true
        type: boolean
      canMark:
        description: 'CanMark: the session can do everything (marking a state never
          needs the plan).'
        example: true
        type: boolean
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      consultDate:
        example: "2026-09-28"
        type: string
      consultationId:
        description: ConsultationID is null for an appointment added without a consultation.
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      createdBy:
        example: Ana
        type: string
      doctorName:
        example: Dra. Laura López
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      location:
        description: Location is the place as the parent wrote it, LocationURL an
          optional https link (Google Maps).
        example: Consultorio 302, Av. Vallarta 1234
        type: string
      locationUrl:
        example: https://maps.app.goo.gl/abc
        type: string
      myReminders:
        example: true
        type: boolean
      note:
        example: ""
        type: string
      notices:
        items:
          $ref: '#/definitions/AppointmentNoticeResponse'
        type: array
      startsAt:
        example: "2026-10-09T16:30:00Z"
        type: string
      status:
        enum:
        - scheduled
        - done
        - canceled
        - unmarked
        example: scheduled
        type: string
      statusAt:
        type: string
      statusBy:
        example: Ana
        type: string
      utcOffsetMinutes:
        example: -360
        type: integer
    type: object
  AppointmentStatusRequest:
    properties:
      status:
        enum:
        - done
        - canceled
        - scheduled
        example: done
        type: string
    type: object
  AppointmentValidationResponse:
    properties:
      details:
        items:
          properties:
            field:
              example: startsAt
              type: string
            message:
              type: string
          type: object
        type: array
      error:
        example: validation_error
        type: string
      message:
        type: string
    type: object
  AppointmentsOfChildResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/AppointmentResponse'
        type: array
      next:
        $ref: '#/definitions/AppointmentResponse'
      paidPlan:
        example: true
        type: boolean
    type: object
  ChildDeviceErrorResponse:
    properties:
      error:
        example: not_found
        type: string
      message:
        example: This link is no longer valid
        type: string
    type: object
  ChildDeviceLinkCreatedResponse:
    properties:
      expiresAt:
        example: "2026-10-23T14:00:00Z"
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      name:
        example: Teléfono de Mateo
        type: string
      status:
        enum:
        - pending
        example: pending
        type: string
      token:
        description: Token is the link's secret. It exists in the clear only in this
          answer; the app puts it in the `#` of the link.
        type: string
    type: object
  ChildDeviceLinkListResponse:
    properties:
      canManage:
        description: 'CanManage: the session can make and remove phones; a caregiver
          only sees the list.'
        type: boolean
      limit:
        example: 3
        type: integer
      links:
        items:
          $ref: '#/definitions/ChildDeviceLinkResponse'
        type: array
    type: object
  ChildDeviceLinkResponse:
    properties:
      createdAt:
        example: "2026-10-22T14:00:00Z"
        type: string
      expiresAt:
        example: "2026-10-23T14:00:00Z"
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      lastSeenAt:
        type: string
      name:
        example: Teléfono de Mateo
        type: string
      redeemedAt:
        type: string
      reminderDetail:
        enum:
        - generic
        - detailed
        example: generic
        type: string
      status:
        enum:
        - pending
        - active
        - revoked
        - expired
        example: active
        type: string
    type: object
  ChildDeviceMeResponse:
    properties:
      childFirstName:
        example: Mateo
        type: string
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      deviceName:
        example: Teléfono de Mateo
        type: string
      reminderDetail:
        enum:
        - generic
        - detailed
        example: generic
        type: string
      rotateAfter:
        description: RotateAfter is when the phone should ask for a new credential.
        example: "2026-10-30T14:00:00Z"
        type: string
    type: object
  ChildDeviceValidationResponse:
    properties:
      details:
        items:
          properties:
            field:
              example: name
              type: string
            message:
              type: string
          type: object
        type: array
      error:
        example: validation_error
        type: string
      message:
        type: string
    type: object
  ChildNotFoundResponse:
    properties:
      error:
        example: child_not_found
        type: string
      message:
        example: Child not found
        type: string
    type: object
  ChildOverviewResponse:
    properties:
      activeTreatment:
        $ref: '#/definitions/ActiveTreatmentResponse'
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      doses:
        items:
          $ref: '#/definitions/OverviewDoseResponse'
        type: array
    type: object
  ConsultationDetailResponse:
    properties:
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      consultDate:
        example: "2026-01-15"
        type: string
      doctorName:
        example: Dra. López
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      medications:
        items:
          $ref: '#/definitions/MedicationResponse'
        type: array
      notes:
        example: Comió mariscos el domingo; la fiebre empezó el lunes
        type: string
      photoBase64:
        type: string
      recordOnly:
        description: 'RecordOnly: saved only as a record (specs/024) — its medications
          have no start time and no doses.'
        example: false
        type: boolean
      symptoms:
        description: Symptoms are the marked symptoms in catalog order, retired ones
          included.
        items:
          $ref: '#/definitions/SymptomResponse'
        type: array
    type: object
  ConsultationFieldError:
    properties:
      field:
        example: doctorName
        type: string
      message:
        example: doctor name is required
        type: string
    type: object
  ConsultationListResponse:
    properties:
      childId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      consultations:
        items:
          $ref: '#/definitions/ConsultationSummaryResponse'
        type: array
    type: object
  ConsultationNotFoundResponse:
    properties:
      error:
        example: consultation_not_found
        type: string
      message:
        example: Consultation not found
        type: string
    type: object
  ConsultationPhotoResponse:
    properties:
      photoBase64:
        description: PhotoBase64 is the prescription photo; empty when the consultation
          was saved without one.
        type: string
    type: object
  ConsultationSessionErrorResponse:
    properties:
      error:
        example: forbidden
        type: string
      message:
        example: This resource does not belong to the current session
        type: string
    type: object
  ConsultationSummaryResponse:
    properties:
      consultDate:
        example: "2026-01-15"
        type: string
      doctorName:
        example: Dra. López
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      medicationCount:
        example: 2
        type: integer
      notes:
        example: Comió mariscos el domingo; la fiebre empezó el lunes
        type: string
      recordOnly:
        description: 'RecordOnly: saved only as a record (specs/024) — no schedule,
          no doses, no reminders.'
        example: false
        type: boolean
      symptomNames:
        example:
        - Fiebre
        - Tos
        items:
          type: string
        type: array
    type: object
  ConsultationValidationErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/ConsultationFieldError'
        type: array
      error:
        example: validation_error
        type: string
      message:
        example: One or more fields are invalid
        type: string
    type: object
  CreateChildDeviceLinkRequest:
    properties:
      name:
        description: Name is what the parent calls the phone. 1 to 40 characters.
        example: Teléfono de Mateo
        type: string
    type: object
  CreatedFamilyInvitationResponse:
    properties:
      email:
        example: papa@ejemplo.com
        type: string
      emailStatus:
        description: |-
          EmailStatus is the initial state of the invitation's e-mail: sending (it is queued; the answer does not wait for it), failed
          (a limit of the day or a full queue left it out) or none (no e-mail is configured). It is never sent here: ask GET /family.
        enum:
        - none
        - sending
        - failed
        example: sending
        type: string
      emailStatusAt:
        description: EmailStatusAt is when the state was set; null for none.
        example: "2026-10-12T14:00:00Z"
        type: string
      expiresAt:
        example: "2026-10-13T14:00:00Z"
        type: string
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      role:
        enum:
        - tutor
        - caregiver
        - child
        example: tutor
        type: string
      status:
        example: pending
        type: string
      token:
        description: Token is the secret of the link; it is returned only here (and
          when resent) and goes in the fragment of the link.
        example: 3hF9…
        type: string
    type: object
  DoseNotFoundResponse:
    properties:
      error:
        example: dose_not_found
        type: string
      message:
        example: Dose not found
        type: string
    type: object
  DoseResponse:
    properties:
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      scheduledAt:
        example: "2026-01-15T08:00:00Z"
        type: string
      status:
        description: |-
          Status is derived by the server with its own clock (specs/013): pending, due ("por marcar"), taken or
          unregistered ("sin registrar": the next dose of its medication came and it isn't marked).
        enum:
        - pending
        - due
        - taken
        - unregistered
        - canceled
        example: due
        type: string
      taken:
        example: false
        type: boolean
      takenBy:
        allOf:
        - $ref: '#/definitions/TakenByResponse'
        description: 'TakenBy: who marked it and when (specs/032); null if it isn''t
          marked or was marked before that feature.'
    type: object
  EmailConflictResponse:
    properties:
      error:
        example: email_already_exists
        type: string
      message:
        example: Email is already in use
        type: string
    type: object
  ErrorLogEntry:
    properties:
      accountId:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      createdAt:
        example: "2026-09-30T14:02:11Z"
        type: string
      endpoint:
        example: /accounts
        type: string
      file:
        example: internal/account/handler.go
        type: string
      httpStatus:
        example: 400
        type: integer
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      line:
        example: 88
        type: integer
      message:
        example: email is required
        type: string
    type: object
  ErrorLogListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/ErrorLogEntry'
        type: array
      nextCursor:
        description: NextCursor is null on the last page.
        example: MTc5MDc3MDAwMDAwMDAwMDAwMC5hMWIyYzNkNA
        type: string
    type: object
  ErrorLogSummaryGroup:
    properties:
      count:
        example: 42
        type: integer
      endpoint:
        example: /accounts
        type: string
      firstSeen:
        example: "2026-09-24T10:00:00Z"
        type: string
      httpStatus:
        example: 400
        type: integer
      lastSeen:
        example: "2026-09-30T13:58:02Z"
        type: string
      message:
        example: email is required
        type: string
    type: object
  ErrorLogSummaryResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/ErrorLogSummaryGroup'
        type: array
    type: object
  ErrorLogValidationError:
    properties:
      details:
        items:
          properties:
            field:
              example: limit
              type: string
            message:
              example: must be a whole number from 1 to 500
              type: string
          type: object
        type: array
      error:
        example: validation_error
        type: string
      message:
        example: One or more fields are invalid
        type: string
    type: object
  ErrorResponse:
    properties:
      error:
        example: internal_error
        type: string
      message:
        example: Could not create account
        type: string
    type: object
  ExportActiveTreatment:
    properties:
      doctorName:
        example: Dra. Laura Cázares
        type: string
      frequencyHours:
        example: 8
        type: integer
      medicationName:
        example: Amoxicilina
        type: string
      since:
        example: "2026-10-18T14:00:00Z"
        type: string
    type: object
  ExportAppointment:
    properties:
      doctorName:
        example: Dra. Laura Cázares
        type: string
      location:
        example: Consultorio 204, Torre Médica Satélite
        type: string
      scheduledAt:
        example: "2026-10-28T16:30:00Z"
        type: string
    type: object
  ExportCardPhoto:
    properties:
      createdAt:
        type: string
      id:
        type: string
    type: object
  ExportChild:
    properties:
      birthDate:
        example: "2021-03-14"
        type: string
      firstName:
        example: Mateo
        type: string
      height:
        example: 112
        type: number
      lastName:
        example: Morales
        type: string
      weight:
        example: 19.4
        type: number
    type: object
  ExportConsultation:
    properties:
      appointment:
        $ref: '#/definitions/ExportAppointment'
      consultDate:
        example: "2026-10-18"
        type: string
      doctorName:
        example: Dra. Laura Cázares
        type: string
      hasPhoto:
        type: boolean
      id:
        type: string
      medications:
        items:
          $ref: '#/definitions/ExportMedication'
        type: array
      notes:
        type: string
      recordOnly:
        type: boolean
      symptoms:
        items:
          $ref: '#/definitions/ExportSymptom'
        type: array
    type: object
  ExportConsultationPhoto:
    properties:
      consultDate:
        example: "2026-10-18"
        type: string
      consultationId:
        type: string
      doctorName:
        example: Dra. Laura Cázares
        type: string
    type: object
  ExportCorrected:
    properties:
      at:
        type: string
      by:
        example: Ana
        type: string
    type: object
  ExportDocument:
    properties:
      activeTreatment:
        $ref: '#/definitions/ExportActiveTreatment'
      child:
        $ref: '#/definitions/ExportChild'
      consultations:
        items:
          $ref: '#/definitions/ExportConsultation'
        type: array
      nextAppointment:
        $ref: '#/definitions/ExportAppointment'
      photos:
        $ref: '#/definitions/ExportPhotos'
      vaccinations:
        items:
          $ref: '#/definitions/ExportVaccination'
        type: array
    type: object
  ExportDoseCounts:
    properties:
      due:
        example: 0
        type: integer
      pending:
        example: 3
        type: integer
      taken:
        example: 16
        type: integer
      total:
        example: 21
        type: integer
      unregistered:
        example: 2
        type: integer
    type: object
  ExportErrorResponse:
    properties:
      error:
        example: child_not_found
        type: string
      message:
        type: string
    type: object
  ExportExtension:
    properties:
      addedDoses:
        example: 2
        type: integer
      createdAt:
        type: string
    type: object
  ExportFiltersRequest:
    properties:
      doctor:
        example: Dra. Laura Cázares
        type: string
      from:
        example: "2026-07-01"
        type: string
      kind:
        example: all
        type: string
      medication:
        example: ""
        type: string
      q:
        example: ""
        type: string
      symptomCodes:
        example:
        - fever
        items:
          type: string
        type: array
      to:
        example: "2026-10-24"
        type: string
    type: object
  ExportMark:
    properties:
      at:
        type: string
      by:
        example: Ana
        type: string
    type: object
  ExportMedication:
    properties:
      doses:
        $ref: '#/definitions/ExportDoseCounts'
      durationDays:
        example: 7
        type: integer
      endedAt:
        type: string
      extensions:
        items:
          $ref: '#/definitions/ExportExtension'
        type: array
      firstDoseAt:
        type: string
      frequencyHours:
        example: 8
        type: integer
      lastDoseAt:
        type: string
      lastMark:
        $ref: '#/definitions/ExportMark'
      name:
        example: Amoxicilina
        type: string
      startTime:
        example: "08:00"
        type: string
    type: object
  ExportPeriodRequest:
    properties:
      filters:
        $ref: '#/definitions/ExportFiltersRequest'
      from:
        example: "2026-01-01"
        type: string
      kind:
        description: Kind is "all" (the whole history), "range" (From–To, days, both
          included) or "filters" (the history's own criteria).
        enum:
        - all
        - range
        - filters
        example: range
        type: string
      to:
        example: "2026-10-24"
        type: string
    type: object
  ExportPhotos:
    properties:
      card:
        items:
          $ref: '#/definitions/ExportCardPhoto'
        type: array
      consultations:
        items:
          $ref: '#/definitions/ExportConsultationPhoto'
        type: array
    type: object
  ExportPlanLimitResponse:
    properties:
      error:
        example: freemium_consultation_limit_exceeded
        type: string
      message:
        type: string
      reason:
        example: pdf_export
        type: string
    type: object
  ExportRequest:
    properties:
      period:
        $ref: '#/definitions/ExportPeriodRequest'
      sections:
        $ref: '#/definitions/ExportSectionsRequest'
    type: object
  ExportSectionsRequest:
    properties:
      consultations:
        example: true
        type: boolean
      photos:
        example: false
        type: boolean
      vaccinations:
        example: true
        type: boolean
    type: object
  ExportSymptom:
    properties:
      code:
        example: fever
        type: string
      name:
        example: Fiebre
        type: string
    type: object
  ExportVaccination:
    properties:
      appliedOn:
        example: "2021-03-15"
        type: string
      corrected:
        $ref: '#/definitions/ExportCorrected'
      custom:
        type: boolean
      doseNumber:
        example: 1
        type: integer
      id:
        type: string
      lot:
        type: string
      name:
        example: Hepatitis B
        type: string
      notes:
        type: string
      place:
        type: string
    type: object
  ExtendTreatmentRequest:
    properties:
      doses:
        description: 'Doses is how many doses to add to the end: a whole number from
          1 to 60.'
        example: 3
        type: integer
    type: object
  ExtensionResponse:
    properties:
      addedDoses:
        example: 3
        type: integer
      createdAt:
        example: "2026-09-30T14:02:00Z"
        type: string
      manual:
        description: Manual is true when the parent changed the number the app proposed.
        example: true
        type: boolean
      proposedDoses:
        example: 2
        type: integer
    type: object
  FamilyCapacityResponse:
    properties:
      max:
        example: 4
        type: integer
      used:
        example: 2
        type: integer
    type: object
  FamilyErrorResponse:
    properties:
      error:
        example: invitation_not_found
        type: string
      message:
        example: Invitation not found
        type: string
    type: object
  FamilyInvitationResponse:
    properties:
      childId:
        type: string
      email:
        example: papa@ejemplo.com
        type: string
      emailStatus:
        description: |-
          EmailStatus is what happened to the invitation's e-mail (specs/040): none = none was asked, sending, sent, failed. A failed
          or missing e-mail never affects the invitation: its link can be copied.
        enum:
        - none
        - sending
        - sent
        - failed
        example: sent
        type: string
      emailStatusAt:
        description: EmailStatusAt is when the state changed; null if an e-mail was
          never asked.
        example: "2026-10-12T14:00:00Z"
        type: string
      expiresAt:
        example: "2026-10-13T14:00:00Z"
        type: string
      id:
