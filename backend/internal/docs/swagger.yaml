  /family/invitations:
    post:
      consumes:
      - application/json
      description: |-
        Invites an e-mail as a Tutor or a Caregiver. Only who can do everything (the owner or a Tutor) and only when the
        owner is on the paid plan. The invitation expires in 7 days; the token of its link is returned here, once.
        Only the account whose verified e-mail is the invited one can accept it. When e-mail is configured the link is also
        e-mailed to the invited person in the background: the answer does not wait for it, `emailStatus` is its initial state.
        Nothing about the e-mail (a provider failure, the daily quota, a limit) ever makes this request fail.
      parameters:
      - description: Who to invite and as what
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/InviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreatedFamilyInvitationResponse'
        "400":
          description: Invalid e-mail or role
          schema:
            $ref: '#/definitions/FamilyValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The session can't invite
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "409":
          description: Already a member, or an invitation is pending
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "422":
          description: The family is not on the paid plan, or it is full (family_full)
          schema:
            $ref: '#/definitions/FamilyPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Invite someone to the family
      tags:
      - family
  /family/invitations/{invitationId}/cancel:
    post:
      parameters:
      - description: Invitation UUID
        in: path
        name: invitationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The session can't invite
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "404":
          description: Not a pending invitation of this family
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
      security:
      - ClerkSession: []
      summary: Cancel a pending invitation
      tags:
      - family
  /family/invitations/{invitationId}/resend:
    post:
      description: Gives a pending invitation a new token and a new date; the old
        link stops working.
      parameters:
      - description: Invitation UUID
        in: path
        name: invitationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CreatedFamilyInvitationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The session can't invite
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "404":
          description: Not a pending invitation of this family
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "422":
          description: Not paid, or the family is full
          schema:
            $ref: '#/definitions/FamilyPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Send an invitation again
      tags:
      - family
  /family/invitations/accept:
    post:
      consumes:
      - application/json
      description: |-
        Makes the session's person a member of the family. Only the account whose verified e-mail is the invited one
        (403 email_mismatch), with a PediTrack account (409 account_required), not already in a family (409
        already_in_family), and while the family's owner is on the paid plan (422). The same person accepting again
        gets their membership back.
      parameters:
      - description: The invitation's token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/InvitationTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FamilyMembershipResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The e-mail is not the invited one, or is not verified
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "404":
          description: Invitation not found
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "409":
          description: No account yet, or already in a family
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "422":
          description: The family's owner is no longer on the paid plan
          schema:
            $ref: '#/definitions/FamilyPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Accept an invitation
      tags:
      - family
  /family/invitations/decline:
    post:
      consumes:
      - application/json
      parameters:
      - description: The invitation's token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/InvitationTokenRequest'
      responses:
        "204":
          description: No Content
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The e-mail is not the invited one
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "404":
          description: Invitation not found
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
      security:
      - ClerkSession: []
      summary: Decline an invitation
      tags:
      - family
  /family/invitations/preview:
    post:
      consumes:
      - application/json
      description: |-
        Only what a person needs to decide: who invites, the role, the invited e-mail, when it expires and whether the
        session's verified e-mail is that one. The token goes in the body (never in an address). An unknown, used,
        expired or canceled token is one 404, with nothing about the family.
      parameters:
      - description: The invitation's token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/InvitationTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/InvitationPreviewResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "404":
          description: Invitation not found
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
      security:
      - ClerkSession: []
      summary: What an invitation offers, before accepting it
      tags:
      - family
  /family/leave:
    post:
      description: |-
        The invited person leaves their family: immediate, no approval. What they registered stays in the family's
        account. The owner can't leave their own family.
      responses:
        "204":
          description: No Content
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The owner can't leave (owner_cannot_leave)
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "404":
          description: The session belongs to no family as an invited person
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
      security:
      - ClerkSession: []
      summary: Leave the family
      tags:
      - family
  /family/members/{memberId}/remove:
    post:
      description: |-
        Only who can do everything in the family (the owner or a Tutor of a paid family). A Tutor can't be removed by
        anybody — not even by the owner —; the only way to cut a Tutor's access is for the owner to stop paying.
        What the person registered stays. Takes effect at once.
      parameters:
      - description: Member UUID (from GET /family)
        in: path
        name: memberId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/FamilySessionErrorResponse'
        "403":
          description: The session can't remove, or the member is a Tutor (cannot_remove_tutor)
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
        "404":
          description: Not an active member of this family
          schema:
            $ref: '#/definitions/FamilyErrorResponse'
      security:
      - ClerkSession: []
      summary: Remove a Caregiver or a Child-role member
      tags:
      - family
  /ops/error-logs:
    get:
      description: |-
        For the team that runs the service, not for parents: needs the operation key (`Authorization: Bearer
        <OPS_API_KEY>`), and the route does not exist when the server has none. A wrong or missing key gets the
        same 404 as an unknown route. Filters by period (default: the last 7 days), endpoint (exact or prefix such as
        `job:`), status and account; paged by cursor (100 by default, at most 500).
      parameters:
      - description: 'RFC 3339; default: 7 days ago'
        in: query
        name: since
        type: string
      - description: 'RFC 3339; default: no upper bound'
        in: query
        name: until
        type: string
      - description: Exact endpoint, e.g. /accounts or job:reminders
        in: query
        name: endpoint
        type: string
      - description: 'Endpoint prefix, e.g. job:'
        in: query
        name: endpointPrefix
        type: string
      - description: HTTP status
        in: query
        name: status
        type: integer
      - description: Account UUID
        in: query
        name: accountId
        type: string
      - description: 1 to 500; default 100
        in: query
        name: limit
        type: integer
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ErrorLogListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorLogValidationError'
      security:
      - OpsKey: []
      summary: List the registered errors, newest first
      tags:
      - operations
  /ops/error-logs/summary:
    get:
      description: |-
        Groups by endpoint, status and message with how often each happened and when first and last; the most
        frequent first (the most recent breaks a tie), up to 100 groups. Same key and filters as the list.
      parameters:
      - description: 'RFC 3339; default: 7 days ago'
        in: query
        name: since
        type: string
      - description: 'RFC 3339; default: no upper bound'
        in: query
        name: until
        type: string
      - description: Exact endpoint
        in: query
        name: endpoint
        type: string
      - description: 'Endpoint prefix, e.g. job:'
        in: query
        name: endpointPrefix
        type: string
      - description: HTTP status
        in: query
        name: status
        type: integer
      - description: Account UUID
        in: query
        name: accountId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ErrorLogSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorLogValidationError'
      security:
      - OpsKey: []
      summary: Summarize the registered errors of a period
      tags:
      - operations
  /payments/fake/{subscriptionId}/{action}:
    post:
      description: Only exists with PAYMENTS_DRIVER=fake. `approve`, `renew`, `reject`,
        `pause` or `cancel`.
      parameters:
      - description: Fake subscription id
        in: path
        name: subscriptionId
        required: true
        type: string
      - description: approve, renew, reject, pause or cancel
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "404":
          description: Unknown subscription or action
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
      summary: Move the fake provider's state (testing only)
      tags:
      - payments
  /payments/webhooks/mercadopago:
    post:
      consumes:
      - application/json
      description: |-
        Mercado Pago tells us a subscription or a charge changed. The signature (`x-signature`) is verified, the resource is read from
        the provider and the result applied idempotently. Always answers 200 for a verified notice (an unknown subscription is ignored);
        500 if the provider could not be asked, so it retries.
      parameters:
      - description: Topic of the notice
        in: query
        name: type
        type: string
      - description: Id of the resource
        in: query
        name: data.id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Invalid signature
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
      summary: Notice of the payment provider
      tags:
      - payments
  /reminders/actions/taken:
    post:
      consumes:
      - application/json
      description: |-
        Public (no session). The token names one dose and the device that received it; it
        only works while that device is on and belongs to the dose's account, and for 24 h.
      parameters:
      - description: The reminder's action token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_reminder.actionRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token or malformed JSON
          schema:
            $ref: '#/definitions/internal_reminder.validationErrorDoc'
        "403":
          description: Invalid, expired or no longer valid token
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
      summary: Mark a dose as taken from its reminder
      tags:
      - reminders
  /reminders/config:
    get:
      description: |-
        Whether this server can send reminders and the VAPID public key to subscribe with
        (null when it can't).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reminder.configResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
      security:
      - ClerkSession: []
      summary: What a browser needs to turn reminders on
      tags:
      - reminders
  /routines/{routineId}:
    get:
      description: The routine with the doses of [from, to) (one calendar month, at
        most 62 days) and its progress.
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      - description: Window start, RFC 3339
        in: query
        name: from
        required: true
        type: string
      - description: Window end (exclusive), RFC 3339
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementRoutineResponse'
        "400":
          description: Missing or invalid window
          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The session has no access to this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No routine exists for this id
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: A supplement routine with its doses
      tags:
      - supplements
    patch:
      consumes:
      - application/json
      description: |-
        Replaces the routine's form (name, note and schedule). It counts from the next dose: future unmarked doses
        are dropped and regenerated; past and marked doses never change. Paid plan only (422 reason "supplements");
        an ended routine cannot be edited (409 routine_ended).
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      - description: The whole routine
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SupplementRoutineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementRoutineResponse'
        "400":
          description: An invalid field
          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The session can't edit this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "409":
          description: The routine has ended
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "422":
          description: Free plan
          schema:
            $ref: '#/definitions/SupplementPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Edit a supplement routine
      tags:
      - supplements
  /routines/{routineId}/done:
    post:
      consumes:
      - application/json
      description: |-
        Marks the earliest unmarked dose of [from, to) (the person's local day, at most 48 hours) of an active
        activity, with the session as author — also a dose that has not come yet. Two people tapping at once mark two
        different doses. It never depends on the plan. 409 nothing_to_mark when none is left (or the routine is not an
        active activity).
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      - description: The local day
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SupplementDoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementDoseResponse'
        "400":
          description: Missing or invalid window
          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: No access to the routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "409":
          description: Nothing left to mark
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: «Realizado» on an activity
      tags:
      - supplements
  /routines/{routineId}/doses/{doseId}:
    patch:
      consumes:
      - application/json
      description: |-
        Marking: the first mark wins and records who marked it and when. Unmarking: only who marked it, or someone
        who can do everything. It never depends on the plan.
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      - description: Dose UUID
        in: path
        name: doseId
        required: true
        type: string
      - description: New taken status
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SupplementUpdateDoseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementDoseResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: No access to the routine, or the mark is someone else's
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such dose in this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: Mark or unmark a routine's dose
      tags:
      - supplements
  /routines/{routineId}/finish:
    post:
      description: |-
        Ends it for good: no more doses or reminders; future unmarked doses disappear, the history stays. It never
        needs the paid plan. Idempotent.
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementRoutineResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The session can't finish this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: Finish a supplement routine
      tags:
      - supplements
  /routines/{routineId}/my-reminders:
    put:
      consumes:
      - application/json
      description: |-
        «Tus avisos»: only for the person who asks, never for the rest of the family. Idempotent; a Caregiver can too.
        Only an active routine has reminders (409 routine_not_active).
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      - description: enabled
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SupplementMyRemindersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementMyRemindersResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: No access to this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "409":
          description: The routine is not active
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: Turn the session's own reminders of a routine on or off
      tags:
      - supplements
  /routines/{routineId}/pause:
    post:
      description: |-
        No more doses or reminders from now on; future unmarked doses disappear, past and marked ones stay. It
        never needs the paid plan.
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementRoutineResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The session can't pause this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "409":
          description: The routine is not active
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: Pause a supplement routine
      tags:
      - supplements
  /routines/{routineId}/resume:
    post:
      consumes:
      - application/json
      description: |-
        Active again from now, without the doses of the time it was paused. Paid plan only (422 reason
        "supplements") and it counts toward the 10 active routines (422 routine_limit_exceeded).
      parameters:
      - description: Routine UUID
        in: path
        name: routineId
        required: true
        type: string
      - description: The device's UTC offset
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SupplementResumeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementRoutineResponse'
        "400":
          description: An invalid offset
          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The session can't resume this routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No such routine
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "409":
          description: The routine ended or is already active
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "422":
          description: Free plan, or the cap of active routines (routineLimitDoc)
          schema:
            $ref: '#/definitions/SupplementPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Resume a paused supplement routine
      tags:
      - supplements
securityDefinitions:
  ClerkSession:
    description: Clerk session token, sent as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
  DeviceCredential:
    description: A child's phone credential (specs/047), sent as "Device <credential>"
      (never "Bearer").
    in: header
    name: Authorization
    type: apiKey
  OpsKey:
    description: Operation key (OPS_API_KEY), sent as "Bearer <key>"; only for the
      team that runs the service.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
