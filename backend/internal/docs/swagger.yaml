        type: string
    type: object
  internal_account.accountResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/internal_account.childResponse'
        type: array
      countryCode:
        example: MX
        type: string
      disclaimerAccepted:
        example: false
        type: boolean
      disclaimerVersion:
        description: |-
          DisclaimerVersion is the version of the "Antes de empezar" notice the client must show, and
          DisclaimerAccepted whether this account already acknowledged it (specs/010-registro-aceptacion-aviso).
        example: "2026-09-26"
        type: string
      email:
        example: ana@example.com
        type: string
      family:
        allOf:
        - $ref: '#/definitions/FamilyMembershipInfo'
        description: |-
          Family is present only when the session is an invited person of another account's family; its children are then
          in Children, after the account's own.
      firstName:
        example: Ana
        type: string
      id:
        example: e5f6a7b8-0000-0000-0000-000000000000
        type: string
      lastName:
        example: Gómez
        type: string
      plan:
        example: free
        type: string
      reminderDetail:
        description: |-
          ReminderDetail is what the dose reminders show, "detailed" or "generic"; null until the tutor
          chooses on the first activation (specs/011-recordatorios-push).
        example: generic
        type: string
      stateCode:
        example: MX-JAL
        type: string
    type: object
  internal_account.childResponse:
    properties:
      accountId:
        description: |-
          AccountID is the account the child belongs to (the family's owner), Role the session's role over this child
          ("owner" for its own children), Plan the plan of that family and ReadOnly whether the session can only see and mark
          (specs/032-compartir-con-familia).
        example: e5f6a7b8-0000-0000-0000-000000000000
        type: string
      birthDate:
        example: "2020-01-15"
        type: string
      firstName:
        example: Luis
        type: string
      height:
        example: 95.5
        type: number
      id:
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      lastName:
        example: Gómez
        type: string
      plan:
        enum:
        - free
        - paid
        example: free
        type: string
      readOnly:
        example: false
        type: boolean
      role:
        enum:
        - owner
        - tutor
        - caregiver
        - child
        example: owner
        type: string
      weight:
        example: 14.2
        type: number
    type: object
  internal_account.createAccountRequest:
    properties:
      children:
        items:
          $ref: '#/definitions/internal_account.createChildRequest'
        type: array
      countryCode:
        example: MX
        type: string
      firstName:
        example: Ana
        type: string
      lastName:
        example: Gómez
        type: string
      stateCode:
        example: MX-JAL
        type: string
    type: object
  internal_account.createChildRequest:
    properties:
      birthDate:
        example: "2020-01-15"
        type: string
      firstName:
        example: Luis
        type: string
      height:
        example: 95.5
        type: number
      lastName:
        example: Gómez
        type: string
      weight:
        example: 14.2
        type: number
    type: object
  internal_account.disclaimerAcceptanceResponse:
    properties:
      acceptedAt:
        example: "2026-09-26T18:04:05Z"
        type: string
      version:
        example: "2026-09-26"
        type: string
    type: object
  internal_account.reminderSettingsRequest:
    properties:
      reminderDetail:
        example: generic
        type: string
    type: object
  internal_appointment.NoticeInput:
    properties:
      atTime:
        type: string
      daysBefore:
        type: integer
      kind:
        $ref: '#/definitions/internal_appointment.NoticeKind'
      leadMinutes:
        type: integer
    type: object
  internal_appointment.NoticeKind:
    enum:
    - before
    - at_time
    type: string
    x-enum-varnames:
    - KindBefore
    - KindAtTime
  internal_catalog.countryResponse:
    properties:
      code:
        example: MX
        type: string
      name:
        example: México
        type: string
    type: object
  internal_catalog.stateResponse:
    properties:
      code:
        example: MX-JAL
        type: string
      name:
        example: Jalisco
        type: string
    type: object
  internal_consultation.createConsultationRequest:
    properties:
      consultDate:
        example: "2026-01-15"
        type: string
      doctorName:
        example: Dra. López
        type: string
      medications:
        items:
          $ref: '#/definitions/internal_consultation.createMedicationRequest'
        type: array
      notes:
        example: Comió mariscos el domingo; la fiebre empezó el lunes
        type: string
      photoBase64:
        type: string
      recordOnly:
        description: |-
          RecordOnly saves the consultation only as a record (specs/024): optional, false by default. When true the
          medications' "startTime" is not required and is discarded, so no doses (and no reminders) exist.
        example: false
        type: boolean
      symptomCodes:
        description: SymptomCodes are catalog codes (GET /catalog/symptoms); optional,
          duplicates ignored.
        example:
        - fever
        - cough
        items:
          type: string
        type: array
      utcOffsetMinutes:
        description: |-
          UTCOffsetMinutes is the parent's UTC offset, so "startTime" is read in
          their own time zone. Optional: 0 (default) means UTC.
        example: -360
        type: integer
    type: object
  internal_consultation.createMedicationRequest:
    properties:
      durationDays:
        example: 5
        type: integer
      frequencyHours:
        example: 8
        type: integer
      name:
        example: Amoxicilina
        type: string
      startTime:
        example: "08:00"
        type: string
    type: object
  internal_consultation.updateDoseRequest:
    properties:
      taken:
        example: true
        type: boolean
    type: object
  internal_reminder.actionRequest:
    properties:
      token:
        example: ZG9zZS4uLg.c2lnbmF0dXJl
        type: string
    type: object
  internal_reminder.configResponse:
    properties:
      available:
        example: true
        type: boolean
      vapidPublicKey:
        example: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
        type: string
    type: object
  internal_reminder.deviceKeysRequest:
    properties:
      auth:
        example: tBHItJI5svbpez7KI4CCXg
        type: string
      p256dh:
        example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM
        type: string
    type: object
  internal_reminder.deviceResponse:
    properties:
      activatedAt:
        example: "2026-09-27T18:04:05Z"
        type: string
      active:
        example: true
        type: boolean
      id:
        example: 5f0c2e7a-0000-0000-0000-000000000000
        type: string
    type: object
  internal_reminder.errorDoc:
    properties:
      error:
        example: reminders_unavailable
        type: string
      message:
        example: Reminders are not available on this server
        type: string
    type: object
  internal_reminder.fieldErrorDoc:
    properties:
      field:
        example: endpoint
        type: string
      message:
        example: is required
        type: string
    type: object
  internal_reminder.registerDeviceRequest:
    properties:
      endpoint:
        example: https://fcm.googleapis.com/fcm/send/abc123
        type: string
      keys:
        $ref: '#/definitions/internal_reminder.deviceKeysRequest'
    type: object
  internal_reminder.removeDeviceRequest:
    properties:
      endpoint:
        example: https://fcm.googleapis.com/fcm/send/abc123
        type: string
    type: object
  internal_reminder.validationErrorDoc:
    properties:
      details:
        items:
          $ref: '#/definitions/internal_reminder.fieldErrorDoc'
        type: array
      error:
        example: validation_error
        type: string
      message:
        example: One or more fields are invalid
        type: string
    type: object
info:
  contact: {}
  description: |-
    Backend API for account/children signup and the país/estado catalog.
    See contracts/post-accounts.md and contracts/get-catalog.md under
    specs/001-registro-cuenta-usuario/ for the source-of-truth prose contracts.
  title: PediTrack API
  version: "1.0"
paths:
  /accounts:
    post:
      consumes:
      - application/json
      description: |-
        Creates a padre/tutor account, optionally with one or more children in the
        same request, for the tutor who already completed sign-up with Clerk (correo+
        contraseña or Google) — the caller's verified Clerk session is required, and its
        email is what gets stored, never a client-supplied one (specs/008-autenticacion-cuenta).
        A brand-new account always starts on the free plan, which allows at most 1 child
        (FR-007) — enforced server-side regardless of what the client already validated.
        Idempotent: if the session already has an account linked, returns it with 200
        instead of creating a duplicate; an account created before authentication existed
        with the same verified email is linked and returned with 200 too.
      parameters:
      - description: Account (and optional children) to create
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.createAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The session already had an account linked
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "400":
          description: Missing/invalid field, e.g. a future birth date
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The session's email address is not verified
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/EmailConflictResponse'
        "422":
          description: Free plan already has 1 child; upgrade required
          schema:
            $ref: '#/definitions/FreemiumLimitResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ClerkSession: []
      summary: Create an account (tutor + optional children)
      tags:
      - accounts
  /accounts/{accountId}:
    get:
      description: |-
        Retrieves an account (tutor + children) by id (FR-001). Requires a Clerk session
        that owns this account (specs/008-autenticacion-cuenta): 403 for any other.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/AccountNotFoundResponse'
      security:
      - ClerkSession: []
      summary: Get an account and its children
      tags:
      - accounts
  /accounts/{accountId}/children:
    post:
      consumes:
      - application/json
      description: |-
        Adds a single child to an account already created, from the home page's
        "Agregar hijo" modal (FR-004). Applies the same field validation and
        freemium 1-child limit as POST /accounts.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Child to add
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.createChildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "400":
          description: Missing/invalid field
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/AccountNotFoundResponse'
        "422":
          description: Free plan already has 1 child; upgrade required
          schema:
            $ref: '#/definitions/FreemiumLimitResponse'
      security:
      - ClerkSession: []
      summary: Add a child to an existing account
      tags:
      - accounts
  /accounts/{accountId}/disclaimer-acceptance:
    post:
      consumes:
      - application/json
      description: |-
        Stores which version of the notice this account acknowledged and when (audit trail).
        Idempotent: acknowledging the same version again returns the original record.
        The version must be the current one, the one every account response carries as
        disclaimerVersion.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Version acknowledged
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.acceptDisclaimerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.disclaimerAcceptanceResponse'
        "400":
          description: Missing or stale version
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/AccountNotFoundResponse'
      security:
      - ClerkSession: []
      summary: Record that the tutor acknowledged the "Antes de empezar" notice
      tags:
      - accounts
  /accounts/{accountId}/reminder-devices:
    post:
      consumes:
      - application/json
      description: |-
        Stores this browser's push subscription for the account. Idempotent by endpoint: an
        endpoint already known (for this or another account) is updated and moved to this
        account — a browser reminds one account at a time.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: The browser's PushSubscription (toJSON())
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_reminder.registerDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Already known, reactivated
          schema:
            $ref: '#/definitions/internal_reminder.deviceResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_reminder.deviceResponse'
        "400":
          description: Missing keys, malformed JSON, or not a supported push service
          schema:
            $ref: '#/definitions/internal_reminder.validationErrorDoc'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
        "403":
          description: The session does not own this account
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
        "404":
          description: Malformed account id
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
        "503":
          description: The server has no VAPID keys
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
      security:
      - ClerkSession: []
      summary: Turn reminders on for this browser
      tags:
      - reminders
  /accounts/{accountId}/reminder-devices/remove:
    post:
      consumes:
      - application/json
      description: Idempotent. An endpoint that isn't this account's is left untouched
        and not reported.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: The browser's endpoint
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_reminder.removeDeviceRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Missing endpoint or malformed JSON
          schema:
            $ref: '#/definitions/internal_reminder.validationErrorDoc'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
        "403":
          description: The session does not own this account
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
        "404":
          description: Malformed account id
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
      security:
      - ClerkSession: []
      summary: Turn reminders off for this browser
      tags:
      - reminders
  /accounts/{accountId}/reminder-settings:
    patch:
      consumes:
      - application/json
      description: |-
        "detailed" (medication, time and child) or "generic" ("Hay una toma programada").
        Applies to every device of the account.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: What reminders show
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_account.reminderSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "400":
          description: Not \"detailed\" or \"generic\", or malformed JSON
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/AccountNotFoundResponse'
      security:
      - ClerkSession: []
      summary: Choose what dose reminders show
      tags:
      - accounts
  /accounts/{accountId}/routines:
    get:
      description: |-
        Lists the routines the person made for themselves — active first, then paused and ended — each with only the
        doses of [from, to) (their local day, at most 48 hours), its progress and its next dose. Nobody else in the
        family sees them. Reading never depends on the plan.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: Window start, RFC 3339
        in: query
        name: from
        required: true
        type: string
      - description: Window end (exclusive), RFC 3339
        in: query
        name: to
        required: true
        type: string
      - description: supplement (default) or activity
        enum:
        - supplement
        - activity
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SupplementPersonalListResponse'
        "400":
          description: Missing or invalid window
          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The account is not the session's own
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: The person's own supplement routines
      tags:
      - supplements
    post:
      consumes:
      - application/json
      description: |-
        Saves the routine the person wrote, exactly as written, and generates its first doses. It is the person's own:
        nobody else in the family sees it or is reminded of it. Part of the paid plan (their own, or the one of a paid
        family they belong to; the server decides): otherwise 422 "freemium_consultation_limit_exceeded" with reason
        "supplements"; with 10 active personal routines, 422 "routine_limit_exceeded".
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      - description: The routine
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SupplementRoutineRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/SupplementRoutineResponse'
        "400":
          description: An invalid field
          schema:
            $ref: '#/definitions/SupplementValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The account is not the session's own
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "422":
          description: No paid plan, or the person has the maximum of active routines
            (routineLimitDoc)
          schema:
            $ref: '#/definitions/SupplementPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Create a supplement routine for the person themselves
      tags:
      - supplements
  /accounts/{accountId}/routines/notice-seen:
    post:
      description: Records, for the account (every device), that the person read it.
        Idempotent.
      responses:
        "204":
          description: No Content
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "403":
          description: The account is not the session's own
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/SupplementErrorResponse'
      security:
      - ClerkSession: []
      summary: «Entendido» on the first-time notice of the personal section
      tags:
      - supplements
  /accounts/{accountId}/subscription:
    get:
      description: |-
        What /planes needs: whether the charge is available in this environment, the price, whether the account can subscribe and, if
        not, why (`already_paid`, `covered_by_family` with the owner's first name, `pending`, `unavailable`), and the subscription's
        public state (no provider id, no card). Reading never depends on the plan.
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SubscriptionStateResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "403":
          description: The account is not the session's own
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "404":
          description: No account exists for this id
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
      security:
      - ClerkSession: []
      summary: The state of the account's subscription and whether it can subscribe
      tags:
      - payments
    post:
      description: |-
        Creates a pending subscription at the payment provider and returns the provider's page, where the person leaves their card
        (PediTrack never sees it). Reuses a pending one of the last 24 hours (200). 409 `subscription_not_allowed` when the account
        already has the full plan or is covered by another account's family (`covered_by_family` with the owner's first name).
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A pending subscription was reused
          schema:
            $ref: '#/definitions/SubscribeResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/SubscribeResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "403":
          description: The account is not the session's own
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "409":
          description: The account cannot subscribe
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "503":
          description: Payments are not available
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
      security:
      - ClerkSession: []
      summary: Start paying the full plan
      tags:
      - payments
  /accounts/{accountId}/subscription/cancel:
    post:
      description: |-
        An active or grace subscription is canceled at the provider and the plan lasts until the end of what was paid; one that never
        paid ends. Idempotent. If the provider fails nothing changes (502).
      parameters:
      - description: Account UUID
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SubscriptionStateResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "403":
          description: The account is not the session's own
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
        "502":
          description: The provider did not cancel it
          schema:
            $ref: '#/definitions/PaymentsErrorResponse'
      security:
      - ClerkSession: []
      summary: Cancel the renewal
      tags:
      - payments
  /accounts/me:
    get:
      description: |-
        Resolves the account linked to the caller's verified Clerk session — the
        replacement for a client-supplied accountId (specs/008-autenticacion-cuenta). An
        account created before authentication existed, with the session's own verified
        email, is linked on this first access. A 404 is the expected state right after a
        brand-new Clerk sign-up, before POST /accounts has run.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_account.accountResponse'
        "404":
          description: No account is linked to this session yet
          schema:
            $ref: '#/definitions/AccountNotFoundForSessionResponse'
      security:
      - ClerkSession: []
      summary: Get the authenticated tutor's own account
      tags:
      - accounts
  /appointments/{appointmentId}:
    get:
      parameters:
      - description: Appointment UUID
        in: path
        name: appointmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppointmentResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session has no access to this appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No such appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
      security:
      - ClerkSession: []
      summary: One appointment
      tags:
      - appointments
    patch:
      consumes:
      - application/json
      description: |-
        The whole appointment is sent. Notices that stay the same keep their already-sent reminders; moving the date makes
        them all again. Only a scheduled one can be edited (409). Paid plan only (422 reason "appointments").
      parameters:
      - description: Appointment UUID
        in: path
        name: appointmentId
        required: true
        type: string
      - description: The appointment
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/AppointmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppointmentResponse'
        "400":
          description: An invalid field
          schema:
            $ref: '#/definitions/AppointmentValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session can't edit this appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No such appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "409":
          description: The appointment is closed
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "422":
          description: Free plan
          schema:
            $ref: '#/definitions/AppointmentPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Edit an appointment's date, note and notices
      tags:
      - appointments
  /appointments/{appointmentId}/my-reminders:
    put:
      consumes:
      - application/json
      description: Only for the person who asks, never for the rest of the family;
        a Caregiver can too. Only a scheduled appointment has reminders (409).
      parameters:
      - description: Appointment UUID
        in: path
        name: appointmentId
        required: true
        type: string
      - description: enabled
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/AppointmentMyRemindersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppointmentMyRemindersResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: No access to this appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No such appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "409":
          description: The appointment is not scheduled
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
      security:
      - ClerkSession: []
      summary: Turn the session's own reminders of an appointment on or off
      tags:
      - appointments
  /appointments/{appointmentId}/status:
    post:
      consumes:
      - application/json
      description: |-
        `done` and `canceled` stop its reminders for everybody and keep it in the history with who and when; `scheduled`
        takes a `done` back. A canceled one is final. It never needs the paid plan.
      parameters:
      - description: Appointment UUID
        in: path
        name: appointmentId
        required: true
        type: string
      - description: The new status
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/AppointmentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppointmentResponse'
        "400":
          description: An unknown status
          schema:
            $ref: '#/definitions/AppointmentValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session can't change this appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No such appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "409":
          description: The change is not possible from its status
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
      security:
      - ClerkSession: []
      summary: Mark an appointment done or canceled
      tags:
      - appointments
  /catalog/countries:
    get:
      description: Read-only catalog used to populate the país selector (contracts/get-catalog.md).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_catalog.countryResponse'
            type: array
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/NotFoundResponse'
      summary: List countries
      tags:
      - catalog
  /catalog/countries/{countryCode}/states:
    get:
      description: |-
        Used to populate the estado selector. Returns an empty array if the country
        has no subdivisions in the catalog (contracts/get-catalog.md).
      parameters:
      - description: ISO country code
        example: MX
        in: path
        name: countryCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_catalog.stateResponse'
            type: array
        "404":
          description: countryCode not found in catalog
          schema:
            $ref: '#/definitions/NotFoundResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/NotFoundResponse'
      summary: List states/provinces for a country
      tags:
      - catalog
  /catalog/symptoms:
    get:
      description: |-
        Active symptoms of the catalog, in order, grouped by their category title; used by the
        "Nueva consulta" form (specs/012-sintomas-notas-consulta/contracts/symptoms-api.md).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/SymptomResponse'
            type: array
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/NotFoundResponse'
      summary: List the symptoms a parent can mark
      tags:
      - catalog
  /catalog/vaccines:
    get:
      description: |-
        Active vaccines of the catalog, in order. Only names: the app records what the parent captured and
        never says what is due (specs/046-cartilla-vacunacion/contracts/api.md).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/VaccineResponse'
            type: array
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/NotFoundResponse'
      summary: List the vaccines a parent can pick
      tags:
      - catalog
  /child-device/me:
    get:
      description: The child the phone belongs to and when to renew its credential.
        Only the first name the app already has of the child.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ChildDeviceMeResponse'
        "401":
          description: The credential does not work
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      security:
      - DeviceCredential: []
      summary: Who this phone is
      tags:
      - child-device
  /child-device/redeem:
    post:
      consumes:
      - application/json
      description: |-
        Public: the secret in the body is the only thing it takes. A link that is unknown, used, expired or canceled
        gets the same 404, which is not written to error_logs. Strictly rate limited.
      parameters:
      - description: The link's token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/RedeemChildDeviceLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RedeemedChildDeviceLinkResponse'
        "404":
          description: The link no longer works
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      summary: Open a child's link
      tags:
      - child-device
  /child-device/reminder-devices:
    post:
      consumes:
      - application/json
      description: |-
        Registers the push subscription of the child's own phone. Its reminders are only for its child's doses, supplements and
        activities: never appointments or anything of the family.
      parameters:
      - description: The browser's push subscription
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_reminder.registerDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Already registered
          schema:
            $ref: '#/definitions/internal_reminder.deviceResponse'
        "201":
          description: Registered now
          schema:
            $ref: '#/definitions/internal_reminder.deviceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reminder.validationErrorDoc'
        "401":
          description: The credential does not work
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
        "503":
          description: This server has no push keys
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
      security:
      - DeviceCredential: []
      summary: Turn reminders on for a child's phone
      tags:
      - child-device
  /child-device/reminder-devices/remove:
    post:
      consumes:
      - application/json
      parameters:
      - description: The browser's endpoint
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_reminder.removeDeviceRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reminder.validationErrorDoc'
        "401":
          description: The credential does not work
          schema:
            $ref: '#/definitions/internal_reminder.errorDoc'
      security:
      - DeviceCredential: []
      summary: Turn reminders off for a child's phone
      tags:
      - child-device
  /child-device/rotate:
    post:
      description: The new credential is returned once; the previous one keeps working
        for 24 hours and then stops.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RotatedChildDeviceCredentialResponse'
        "401":
          description: The credential does not work
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      security:
      - DeviceCredential: []
      summary: Renew the phone's credential
      tags:
      - child-device
  /children/{childId}/appointments:
    get:
      description: |-
        `next` is the nearest scheduled appointment that has not passed, across the child's consultations; `history`
        has the done, canceled and «Pasó sin marcar» ones, most recent first. Reading never depends on the plan.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppointmentsOfChildResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session has no access to this child
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
      security:
      - ClerkSession: []
      summary: A child's next appointment and the history of the rest
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: |-
        For an appointment the parent already has and no consultation to hang it from: it keeps its own doctor, place
        (`location`, and an optional https `locationUrl`, e.g. a Google Maps link), note and notices. Same rules as the one of
        a consultation, except there is no «one scheduled per consultation» limit. Paid plan only (422 reason "appointments").
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: The appointment
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/AppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AppointmentResponse'
        "400":
          description: An invalid field
          schema:
            $ref: '#/definitions/AppointmentValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session can't add appointments here
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "422":
          description: Free plan
          schema:
            $ref: '#/definitions/AppointmentPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Add an appointment to a child, with no consultation
      tags:
      - appointments
  /children/{childId}/consultations:
    get:
      description: Lists a child's medical consultations (date, doctor, notes, marked
        symptom names in catalog order and medication count), most recent first (FR-001).
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConsultationListResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildNotFoundResponse'
      security:
      - ClerkSession: []
      summary: List a child's consultations
      tags:
      - consultations
    post:
      consumes:
      - application/json
      description: |-
        Registers a consultation with its prescription photo, medications, notes and marked symptoms
        (FR-003, FR-004). At least one medication is required (FR-015), and each one needs
        its startTime ("HH:MM"): all of its doses are generated at once from it (research.md).
        Every symptomCodes entry must be an active catalog symptom, or 400 with details[].message "symptom_not_available" (specs/012).
        On the free plan, a consultation is refused with 422 "freemium_consultation_limit_exceeded" while any child of the account
        still has an active treatment (reason "active_treatment") and when recordOnly is true (reason "record_only"); paid accounts have neither limit (specs/030).
        The photo is required until the account keeps 100 consultations with one; from then on a photo is refused with
        422 "photo_limit_exceeded" and a consultation without photoBase64 is saved (its detail returns an empty photoBase64).
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: Consultation to register
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_consultation.createConsultationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ConsultationDetailResponse'
        "400":
          description: Missing/invalid field
          schema:
            $ref: '#/definitions/ConsultationValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildNotFoundResponse'
        "422":
          description: 'Free plan: another treatment is still active, or recordOnly
            (specs/030)'
          schema:
            $ref: '#/definitions/PlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Register a new medical consultation
      tags:
      - consultations
  /children/{childId}/consultations/search:
    post:
      consumes:
      - application/json
      description: |-
        The paid plan's history: lists the child's consultations that meet every criterion given (text, date range,
        doctor, medication, symptoms, kind), most recent first, in the same shape as the plain list. It only finds what
        was registered. It is a POST so the typed text is not part of the address. A free account always gets 422
        "freemium_consultation_limit_exceeded" with reason "history_search" and no consultations.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: Criteria (all optional)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/SearchConsultationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConsultationListResponse'
        "400":
          description: Malformed body or an invalid criterion
          schema:
            $ref: '#/definitions/ConsultationValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildNotFoundResponse'
        "422":
          description: 'Free plan: searching the history is part of the paid plan'
          schema:
            $ref: '#/definitions/PlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Search and filter a child's consultations
      tags:
      - consultations
  /children/{childId}/device-links:
    get:
      description: |-
        Names, when each was linked, when it was last used and its state. Never a secret or a hash. A caregiver can see it
        (`canManage` false) but not change it.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ChildDeviceLinkListResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "403":
          description: The session has no access to this child
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      security:
      - ClerkSession: []
      summary: A child's phones
      tags:
      - child-device
    post:
      consumes:
      - application/json
      description: |-
        Part of the paid plan (the server decides, under the owner account's lock): a free account gets 422
        "freemium_consultation_limit_exceeded" with reason "child_device". A child keeps at most 3 phones plus
        pending links (422 "child_device_limit_exceeded"). The token is returned once.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: The phone's name
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/CreateChildDeviceLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ChildDeviceLinkCreatedResponse'
        "400":
          description: Invalid name
          schema:
            $ref: '#/definitions/ChildDeviceValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "403":
          description: The session can't manage this child
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "404":
          description: No child exists for this id
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "422":
          description: The plan or the cap of phones
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      security:
      - ClerkSession: []
      summary: Make the one-use link of a child's phone
      tags:
      - child-device
  /children/{childId}/device-links/{linkId}:
    patch:
      consumes:
      - application/json
      description: «generic» (no medication, no child) or «detailed». Generic by default.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: Link UUID
        in: path
        name: linkId
        required: true
        type: string
      - description: The choice
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/UpdateChildDeviceLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ChildDeviceLinkResponse'
        "400":
          description: Not generic or detailed
          schema:
            $ref: '#/definitions/ChildDeviceValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "403":
          description: The session can't manage this child
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "404":
          description: No such phone for this child
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      security:
      - ClerkSession: []
      summary: What a phone's reminders say
      tags:
      - child-device
  /children/{childId}/device-links/{linkId}/revoke:
    post:
      description: |-
        At once: the phone's next request is refused. Also cancels a link nobody opened. Idempotent. What the phone already
        marked stays, still under the child's name.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
      - description: Link UUID
        in: path
        name: linkId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "403":
          description: The session can't manage this child
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
        "404":
          description: No such phone for this child
          schema:
            $ref: '#/definitions/ChildDeviceErrorResponse'
      security:
      - ClerkSession: []
      summary: Remove a phone
      tags:
      - child-device
  /children/{childId}/export:
    post:
      consumes:
      - application/json
      description: |-
        Everything the history's PDF shows, in one read-only answer: the child, the consultations of the period with the record
        of their doses (only counts), the running treatment, the next appointments and the whole vaccination card (the period
        never narrows it). Photos are only listed; each one is asked for apart. The choice travels in the body, never in the
        address. Part of the paid plan: a free family gets 422 "freemium_consultation_limit_exceeded" with reason "pdf_export"
        and no data, even when only the card was asked for.
      parameters:
      - description: Child UUID
        in: path
        name: childId
        required: true
        type: string
