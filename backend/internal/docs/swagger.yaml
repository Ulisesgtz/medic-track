      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConsultationDetailResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No consultation exists for this id
          schema:
            $ref: '#/definitions/ConsultationNotFoundResponse'
      security:
      - ClerkSession: []
      summary: Get a consultation's full detail
      tags:
      - consultations
  /consultations/{consultationId}/appointment:
    get:
      description: The appointment that is still scheduled (it may read «unmarked»
        once its day ended), or null.
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppointmentOfConsultationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session has no access to this consultation
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No consultation exists for this id
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
      security:
      - ClerkSession: []
      summary: A consultation's scheduled appointment
      tags:
      - appointments
  /consultations/{consultationId}/appointments:
    post:
      consumes:
      - application/json
      description: |-
        Saves the appointment exactly as written; nothing else of the consultation changes. Paid plan only (422 reason
        "appointments"). Without `notices` it gets one day before and two hours before; a notice already past is saved
        but never fires. A consultation has at most one scheduled appointment (409).
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      - description: The appointment
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/AppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AppointmentResponse'
        "400":
          description: An invalid field
          schema:
            $ref: '#/definitions/AppointmentValidationResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "403":
          description: The session can't add appointments here
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "404":
          description: No consultation exists for this id
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "409":
          description: Already has a scheduled appointment
          schema:
            $ref: '#/definitions/AppointmentErrorResponse'
        "422":
          description: Free plan
          schema:
            $ref: '#/definitions/AppointmentPlanLimitResponse'
      security:
      - ClerkSession: []
      summary: Add a next appointment to a consultation
      tags:
      - appointments
  /consultations/{consultationId}/doses/{doseId}:
    patch:
      consumes:
      - application/json
      description: |-
        Sets a dose's taken status. No validation of scheduled date or treatment
        status — a dose can be marked/unmarked at any time (FR-011, FR-016).
        Marking is first-come: a dose already marked answers 200 as it is, with who marked it (takenBy, specs/032).
        Unmarking is for who marked it or for someone who can do everything (the owner or a Tutor); anyone else gets 403.
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      - description: Dose UUID
        in: path
        name: doseId
        required: true
        type: string
      - description: New taken status
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_consultation.updateDoseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DoseResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No dose exists for this id
          schema:
            $ref: '#/definitions/DoseNotFoundResponse'
      security:
      - ClerkSession: []
      summary: Mark or unmark a dose as taken
      tags:
      - consultations
  /consultations/{consultationId}/medications/{medicationId}/end:
    post:
      description: |-
        Records when the parent ended the treatment (irreversible). No dose is deleted: the ones whose
        time hadn't come turn "canceled" and stop being reminded. Idempotent: ending it again returns the
        same result (specs/016).
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      - description: Medication UUID
        in: path
        name: medicationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MedicationResponse'
        "400":
          description: 'Nothing left to end (details: nothing_to_end)'
          schema:
            $ref: '#/definitions/ConsultationValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No such medication in this consultation
          schema:
            $ref: '#/definitions/MedicationNotFoundResponse'
      security:
      - ClerkSession: []
      summary: End a medication's treatment early
      tags:
      - consultations
  /consultations/{consultationId}/medications/{medicationId}/extend:
    post:
      consumes:
      - application/json
      description: |-
        Only because the parent decided so (their doctor told them to): adds `doses` doses after the last one, one
        frequency apart, records who decided and what was proposed vs confirmed, and marks the unregistered doses as
        covered so they are never proposed twice. Nothing that exists changes. Not idempotent on purpose: a second
        attempt for the same doses gets nothing_to_extend (specs/020).
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      - description: Medication UUID
        in: path
        name: medicationId
        required: true
        type: string
      - description: How many doses to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ExtendTreatmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MedicationResponse'
        "400":
          description: 'doses out of range, or nothing to extend (details: nothing_to_extend)'
          schema:
            $ref: '#/definitions/ConsultationValidationErrorResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No such medication in this consultation
          schema:
            $ref: '#/definitions/MedicationNotFoundResponse'
      security:
      - ClerkSession: []
      summary: Add doses to the end of a medication's treatment
      tags:
      - consultations
  /consultations/{consultationId}/photo:
    get:
      description: Only the photo, for the history's PDF, which asks for each photo
        apart instead of all of them in one answer.
      parameters:
      - description: Consultation UUID
        in: path
        name: consultationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConsultationPhotoResponse'
        "401":
          description: No valid Clerk session
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "403":
          description: The session does not own this resource
          schema:
            $ref: '#/definitions/ConsultationSessionErrorResponse'
        "404":
          description: No consultation exists for this id
          schema:
            $ref: '#/definitions/ConsultationNotFoundResponse'
      security:
      - ClerkSession: []
      summary: The prescription photo of a consultation
      tags:
      - consultations
