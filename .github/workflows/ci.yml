name: CI

# Enforces constitution Principio VI: >90% unit test coverage (Go + React)
# as a merge-blocking gate, plus a separate Playwright E2E gate.

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/peditrack_test?sslmode=disable

jobs:
  backend-coverage:
    name: Backend — tests + >90% coverage gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peditrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Apply migrations
        run: |
          for f in backend/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -f "$f"
          done
        env:
          PGPASSWORD: postgres

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Known vulnerabilities (govulncheck)
        working-directory: backend
        # Fails only for vulnerabilities in code the API actually calls (standard library, x/text, go-jose...). If it fails,
        # raise the Go version in go.mod or the module it names (specs/037).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Verify Swagger docs are up to date
        working-directory: backend
        run: |
          go run github.com/swaggo/swag/cmd/swag init -g cmd/api/main.go -o internal/docs --pd
          git diff --exit-code -- internal/docs || {
            echo "::error::internal/docs is out of date — run 'swag init -g cmd/api/main.go -o internal/docs --pd' from backend/ and commit the result.";
            exit 1;
          }

      - name: Test with coverage
        working-directory: backend
        run: |
          go test ./internal/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Enforce >90% coverage on internal packages
        working-directory: backend
        run: |
          total=$(grep '^total:' coverage.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage (internal/...): ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 90) }'
        # Note: cmd/api (wiring-only entry point) is intentionally excluded
        # from this gate — see backend/CLAUDE.md for the open question on
        # whether/how to test it.

  frontend-coverage:
    name: Frontend — unit tests + >90% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Unit tests with coverage
        working-directory: frontend
        # vitest.config.ts already sets thresholds: 90% lines/functions/branches/statements
        # and fails the run (non-zero exit) if any metric is below that.
        run: npx vitest run --coverage

  frontend-e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The suite is split in five jobs that run at the same time (~2 min of tests each instead of ~12 in one): Chromium, which runs
    # every spec, in three shards, and Firefox and WebKit, which run only the CROSS_BROWSER_SPECS of playwright.config.ts. Each job
    # has its own API and database and installs only its browser. The «Frontend — Playwright E2E gate» job below sums them up.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'chromium 1/3', project: chromium, shard: 1/3 }
          - { name: 'chromium 2/3', project: chromium, shard: 2/3 }
          - { name: 'chromium 3/3', project: chromium, shard: 3/3 }
          - { name: firefox, project: firefox, shard: 1/1 }
          - { name: webkit, project: webkit, shard: 1/1 }
    # One run per branch and job: a new push to a PR cancels its own older run; runs of other branches don't wait any more (they
    # used to queue repo-wide). The Clerk development instance is shared, but no run deletes another's users: each test deletes
    # its own and the global cleanup only removes the marked ones older than 10 minutes (e2e/global.setup.ts).
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.project }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peditrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply migrations
        run: |
          for f in backend/migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f"
          done
        env:
          PGPASSWORD: postgres

      - name: Generate throwaway reminder keys
        # Dose reminders (specs/011) need VAPID keys and an action secret. Fresh ones per run, made with
        # Node's own crypto (no download): the E2E suite never reaches a real push service.
        run: |
          node -e "
            const c = require('crypto');
            const k = c.generateKeyPairSync('ec', { namedCurve: 'prime256v1' });
            const pub = k.publicKey.export({ format: 'jwk' });
            const priv = k.privateKey.export({ format: 'jwk' });
            const raw = Buffer.concat([Buffer.from([4]), Buffer.from(pub.x, 'base64url'), Buffer.from(pub.y, 'base64url')]);
            console.log('VAPID_PUBLIC_KEY=' + raw.toString('base64url'));
            console.log('VAPID_PRIVATE_KEY=' + priv.d);
            console.log('VAPID_SUBJECT=ci@example.com');
            console.log('REMINDER_ACTION_SECRET=' + c.randomBytes(32).toString('base64url'));
          " >> "$GITHUB_ENV"

      - name: Start backend API
        working-directory: backend
        run: nohup go run ./cmd/api > /tmp/backend.log 2>&1 &
        env:
          FRONTEND_ORIGIN: http://localhost:5173
          # The invitations' e-mail flow runs for real but nothing is sent (specs/040); the E2E suite checks the states it shows.
          MAIL_DRIVER: discard
          # The payment provider is the in-memory fake (specs/045): the E2E suite pays on its stand-in page, nothing reaches Mercado Pago.
          PAYMENTS_DRIVER: fake
          # The API refuses to start without it (specs/008). Repository secret: the *test* (sk_test_) key of the Clerk development instance.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Get Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        # Only this job's browser is kept, under a key of its own (Playwright version + browser). `playwright install` below still
        # runs: it installs the system packages and skips what is already cached.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}

      - name: Install Playwright browser
        working-directory: frontend
        # Only this job's browser and its system packages. The package mirrors are sometimes very slow (a run took 15 minutes here):
        # each try is cut at 4 minutes and tried again once, instead of holding the whole gate.
        # The system packages go first and are never cut in the middle: a `timeout` kills npx but leaves its apt-get running with
        # the dpkg lock (PR 67: the retry then failed with «Could not get lock»). apt itself waits for the lock (the runner's own
        # unattended upgrades can hold it at start); only the step's limit stops a mirror that hangs. The browser download is
        # retried once.
        timeout-minutes: 15
        run: |
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-wait-for-lock > /dev/null
          npx playwright install-deps ${{ matrix.project }}
          for try in 1 2; do
            timeout 300 npx playwright install ${{ matrix.project }} && exit 0
            echo "Downloading the browser took too long or failed (try $try)"
          done
          exit 1

      - name: Wait for backend
        # wait-on's http:// scheme probes with HEAD by default, and chi
        # (the backend's router) doesn't auto-map HEAD to GET handlers, so a
        # plain http:// URL gets a 405 forever even once the server is up.
        # http-get:// forces a GET probe instead.
        run: |
          npx wait-on http-get://localhost:8080/catalog/countries --timeout 60000

      - name: Run Playwright E2E suite
        working-directory: frontend
        # playwright.config.ts's webServer builds the frontend and serves it
        # (`vite preview`) itself and waits for it — don't also start one here,
        # or Playwright refuses to bind :5173 ("already used") since
        # reuseExistingServer is false in CI (process.env.CI is set). The build
        # reads VITE_CLERK_PUBLISHABLE_KEY from the env below. Several workers
        # (E2E_WORKERS) share the job; the job runs one project and one shard.
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          # Two per job, ten at once across the five: with four per job (twenty at once) the shared Clerk development instance
          # answered 429 more than the retries could absorb (PR 67's first run).
          E2E_WORKERS: '2'
          # Tells the suite the API was started with MAIL_DRIVER=discard (specs/040).
          MAIL_DRIVER: discard
          # The frontend throws without it (specs/008). Repository secret: the *test* (pk_test_) key of the Clerk development instance.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # The suite signs up and signs in as real users of that development instance (Clerk testing token, `+clerk_test`
          # addresses) and deletes them afterwards (e2e/global.setup.ts). It refuses any key that is not sk_test_.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ strategy.job-index }}
          path: /tmp/backend.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: frontend/playwright-report/

  frontend-e2e-gate:
    # The one check to look at (the name it always had): green only if all five E2E jobs passed.
    name: Frontend — Playwright E2E gate
    needs: frontend-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All E2E jobs passed
        run: test "${{ needs.frontend-e2e.result }}" = "success"
